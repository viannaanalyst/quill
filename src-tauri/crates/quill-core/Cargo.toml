[package]
name = "quill-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
mail-parser = "1.0.1"
keyring = { version = "3", features = ["apple-native", "windows-native"], optional = true }
open = { version = "5.4.5", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "rt", "sync"], optional = true }
url = "2.5.8"
# IMAP/SMTP (iCloud e outros provedores), tudo com rustls: nada de OpenSSL do sistema
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"], optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier", "hostname"], optional = true }

[features]
default = []
# rede: conversa com o Google (o app usa; os testes de lógica não precisam)
net = ["dep:reqwest", "dep:tokio", "dep:async-imap", "dep:futures-util", "dep:tokio-rustls", "dep:rustls-platform-verifier", "dep:lettre"]
# app de computador: cofre de senhas do sistema e abrir o navegador
desktop = ["net", "dep:keyring", "dep:open"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "rt", "rt-multi-thread"] }
