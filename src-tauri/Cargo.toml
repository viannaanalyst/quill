[package]
name = "quill"
version = "0.2.4"
description = "Quill: e-mail e agenda num lugar só"
authors = ["Gabriel Vianna"]
license = ""
repository = "https://github.com/viannaanalyst/quill"
edition = "2024"
rust-version = "1.90"

[lib]
name = "quill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23.1"
quill-core = { path = "crates/quill-core", features = ["desktop"] }

# Touch ID, ícone do Dock e folha de login (só no Mac)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString", "NSData", "NSURL"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSWindow"] }
# Login do Google na folha do macOS (ASWebAuthenticationSession)
objc2-authentication-services = { version = "0.3", default-features = false, features = ["std", "block2", "ASFoundation", "ASWebAuthenticationSession"] }

# App mais leve no build final: otimiza para tamanho, junta tudo e tira símbolos de depuração.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
