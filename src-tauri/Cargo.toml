[package]
name = "quill"
version = "0.1.0"
description = "Quill: e-mail e agenda num lugar só"
authors = ["Gabriel Vianna"]
license = ""
repository = "https://github.com/viannaanalyst/quill"
edition = "2024"
rust-version = "1.90"

[lib]
name = "quill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5" }

[dependencies]
tauri = { version = "2.12.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# App mais leve no build final: otimiza para tamanho, junta tudo e tira símbolos de depuração.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
